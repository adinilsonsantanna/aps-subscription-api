<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Assinatura</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f6f9fc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            max-width: 520px;
            width: 100%;
            padding: 32px;
        }

        h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .field-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #635bff;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .field-group {
            flex: 1;
        }

        #card-element {
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fff;
        }

        #card-element.StripeElement--focus {
            border-color: #635bff;
        }

        #card-errors {
            color: #e25950;
            font-size: 13px;
            margin-top: 8px;
            min-height: 18px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #635bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: #4f4cd3;
        }

        button:disabled {
            background: #c0c0c0;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .test-badge {
            display: inline-block;
            background: #ffd700;
            color: #333;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #635bff;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 13px;
            color: #444;
        }

        .info-box code {
            background: #e8e8e8;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #635bff;
            margin: 24px 0 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 6px;
        }

        .api-key-field input {
            font-family: monospace;
            font-size: 13px;
        }
    </style>
    <base target="_blank">
</head>

<body>
    <div class="container">
        <div class="test-badge">MODO TESTE</div>
        <h1>Checkout de Assinatura</h1>
        <p class="subtitle">Preencha os dados para criar uma assinatura de teste</p>

        <div class="info-box">
            <strong>Cartao de teste Stripe:</strong> <code>4242 4242 4242 4242</code><br>
            Validade futura qualquer | CVC: 123 | CEP: 12345
        </div>

        <form id="checkout-form">
            <div class="section-title">Autenticacao</div>
            <div class="field-group api-key-field">
                <label for="apiKey">X-API-Key (modo teste)</label>
                <input type="password" id="apiKey" placeholder="Sua API Key" required>
            </div>

            <div class="section-title">Loja</div>
            <div class="field-group">
                <label for="domain">Domain da Loja (Shopify)</label>
                <input type="text" id="domain" placeholder="minhaloja.myshopify.com" required>
            </div>

            <div class="section-title">Cliente</div>
            <div class="row">
                <div class="field-group">
                    <label for="customerName">Nome</label>
                    <input type="text" id="customerName" placeholder="Joao Silva" required>
                </div>
                <div class="field-group">
                    <label for="customerEmail">E-mail</label>
                    <input type="email" id="customerEmail" placeholder="joao@email.com" required>
                </div>
            </div>
            <div class="field-group">
                <label for="shopifyCustomerId">Shopify Customer ID</label>
                <input type="text" id="shopifyCustomerId" placeholder="gid://shopify/Customer/1234567890" required>
            </div>

            <div class="section-title">Produto</div>
            <div class="row">
                <div class="field-group">
                    <label for="shopifyProductId">Shopify Product ID</label>
                    <input type="text" id="shopifyProductId" placeholder="gid://shopify/Product/9876543210" required>
                </div>
                <div class="field-group">
                    <label for="shopifyVariantId">Shopify Variant ID</label>
                    <input type="text" id="shopifyVariantId" placeholder="gid://shopify/ProductVariant/1122334455"
                        required>
                </div>
            </div>

            <div class="section-title">Plano</div>
            <div class="row">
                <div class="field-group">
                    <label for="priceAmount">Valor (centavos)</label>
                    <input type="number" id="priceAmount" placeholder="2000" value="2000" required>
                </div>
                <div class="field-group">
                    <label for="currency">Moeda</label>
                    <input type="text" id="currency" placeholder="BRL" value="BRL" required>
                </div>
            </div>
            <div class="row">
                <div class="field-group">
                    <label for="interval">Intervalo</label>
                    <input type="number" id="interval" placeholder="1" value="1" required>
                </div>
                <div class="field-group">
                    <label for="intervalType">Tipo</label>
                    <input type="text" id="intervalType" placeholder="month" value="month" required>
                </div>
            </div>

            <div class="section-title">Pagamento</div>
            <div class="field-group">
                <label>Dados do Cartao</label>
                <div id="card-element"></div>
                <div id="card-errors"></div>
            </div>

            <button type="submit" id="submit-btn">
                Criar Assinatura
            </button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        var API_BASE = window.location.origin;
        var stripe, cardElement;

        async function initStripe() {
            try {
                var res = await fetch(API_BASE + "/api/checkout/setup");
                var data = await res.json();

                if (!data.publishableKey) {
                    throw new Error("Publishable key nao retornada");
                }

                stripe = Stripe(data.publishableKey);
                var elements = stripe.elements({
                    appearance: { theme: 'stripe' }
                });

                cardElement = elements.create('card', {
                    style: {
                        base: {
                            fontSize: '15px',
                            color: '#1a1a2e',
                            '::placeholder': { color: '#aab7c4' }
                        },
                        invalid: { color: '#e25950' }
                    }
                });

                cardElement.mount('#card-element');

                cardElement.on('change', function (event) {
                    var errorDiv = document.getElementById('card-errors');
                    errorDiv.textContent = event.error ? event.error.message : '';
                });

            } catch (err) {
                showResult('error', 'Erro ao inicializar Stripe: ' + err.message);
            }
        }

        function showResult(type, message) {
            var resultDiv = document.getElementById('result');
            resultDiv.className = 'result ' + type;
            resultDiv.innerHTML = message;
            resultDiv.style.display = 'block';
        }

        function setLoading(loading) {
            var btn = document.getElementById('submit-btn');
            btn.disabled = loading;
            btn.innerHTML = loading
                ? '<span class="spinner"></span>Processando...'
                : 'Criar Assinatura';
        }

        document.getElementById('checkout-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            setLoading(true);
            document.getElementById('result').style.display = 'none';

            var apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                showResult('error', 'API Key e obrigatoria');
                setLoading(false);
                return;
            }

            try {
                // 1. Criar PaymentMethod no Stripe
                var result = await stripe.createPaymentMethod({
                    type: 'card',
                    card: cardElement,
                    billing_details: {
                        name: document.getElementById('customerName').value,
                        email: document.getElementById('customerEmail').value,
                    }
                });

                if (result.error) {
                    throw new Error(result.error.message);
                }

                var paymentMethod = result.paymentMethod;
                console.log("[Checkout] PaymentMethod criado:", paymentMethod.id);

                // 2. Criar assinatura na API
                var payload = {
                    domain: document.getElementById('domain').value,
                    shopifyCustomerId: document.getElementById('shopifyCustomerId').value,
                    shopifyProductId: document.getElementById('shopifyProductId').value,
                    shopifyVariantId: document.getElementById('shopifyVariantId').value,
                    interval: parseInt(document.getElementById('interval').value),
                    intervalType: document.getElementById('intervalType').value,
                    customerEmail: document.getElementById('customerEmail').value,
                    customerName: document.getElementById('customerName').value,
                    paymentMethodId: paymentMethod.id,
                    priceAmount: parseInt(document.getElementById('priceAmount').value),
                    currency: document.getElementById('currency').value,
                    gateway: "stripe"
                };

                var res = await fetch(API_BASE + "/api/subscriptions", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify(payload)
                });

                var data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || data.error || ("HTTP " + res.status));
                }

                showResult('success',
                    '<strong>Assinatura criada com sucesso!</strong><br><br>' +
                    '<b>ID:</b> ' + data.subscription.id + '<br>' +
                    '<b>Stripe Subscription:</b> ' + data.gatewaySubscriptionId + '<br>' +
                    '<b>Status:</b> ' + data.subscription.status + '<br>' +
                    '<b>Proxima cobranca:</b> ' + new Date(data.subscription.nextBillingAt).toLocaleDateString('pt-BR')
                );

            } catch (err) {
                console.error("[Checkout] Erro:", err);
                showResult('error', '<strong>Erro:</strong> ' + err.message);
            } finally {
                setLoading(false);
            }
        });

        // Inicializar
        initStripe();
    </script>
</body>

</html>
