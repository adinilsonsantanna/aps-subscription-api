name: Recover gift once

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Recover allowlisted job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          status="$(curl --silent --show-error --max-time 30 \
            --output response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://aps-subscription-api.vercel.app/api/cron/subscription-gifts/recover?jobId=cmu5q5t5e0003jw04zv6faoqy")"
          echo "HTTP ${status}"
          node -e 'const fs=require("fs"); const b=JSON.parse(fs.readFileSync("response.json","utf8")); console.log(JSON.stringify({status:b.status,stage:b.stage,error:b.error,success:b.success,idempotent:b.idempotent,resultCode:b.resultCode,processedAt:b.processedAt}));'
          test "$status" -ge 200
          test "$status" -lt 300
