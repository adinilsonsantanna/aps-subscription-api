name: Process subscription gifts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  process-gifts:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call subscription gifts worker
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not configured" >&2
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          status="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://aps-subscription-api.vercel.app/api/cron/subscription-gifts")"

          sanitized_body="$(jq -c '
            walk(
              if type == "object" then
                with_entries(
                  if (.key | ascii_downcase | test("token|secret|authorization|api.?key|password|cookie"))
                  then .value = "[REDACTED]"
                  else .
                  end
                )
              else .
              end
            )
          ' "${response_file}" 2>/dev/null || printf '%s' '{"error":"non_json_response"}')"
          request_id="$(printf '%s' "${sanitized_body}" | jq -r '.requestId // .request_id // empty' 2>/dev/null || true)"
          echo "Subscription gifts worker HTTP ${status}; requestId=${request_id:-absent}; response=${sanitized_body}"

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "Subscription gifts worker returned non-2xx HTTP ${status}" >&2
            exit 1
          fi
