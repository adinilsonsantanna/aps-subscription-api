name: Process subscription gifts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  process-gifts:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call subscription gifts worker
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not configured" >&2
            exit 1
          fi

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://aps-subscription-api.vercel.app/api/cron/subscription-gifts")"

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "Subscription gifts worker returned HTTP ${status}" >&2
            exit 1
          fi

          echo "Subscription gifts worker completed with HTTP ${status}"
