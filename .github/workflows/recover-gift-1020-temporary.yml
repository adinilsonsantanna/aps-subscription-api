name: Recover gift 1020 (temporary)

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Recover allowlisted job
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET}"
          status="$(curl --silent --show-error --max-time 30 \
            --output response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://aps-subscription-api.vercel.app/api/cron/subscription-gifts/recover?jobId=cmu5q5t5e0003jw04zv6faoqy")"
          echo "HTTP ${status}"
          node -e 'const fs=require("fs"); const raw=fs.readFileSync("response.json","utf8"); try { const body=JSON.parse(raw); console.log(JSON.stringify({status:body.status,success:body.success,idempotent:body.idempotent,resultCode:body.resultCode,processedAt:body.processedAt,error:body.error})); } catch { console.log(JSON.stringify({bodyType:"non_json"})); process.exit(1); }'
          test "${status}" -ge 200
          test "${status}" -lt 300
